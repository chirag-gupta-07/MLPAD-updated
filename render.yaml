services:
  # Backend Web Service
  - type: web
    name: mplads-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PERSIST_DATABASE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Static Site
  - type: static_site
    name: mplads-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mplads-backend.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://mplads-backend.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
